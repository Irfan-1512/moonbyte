<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonbyte</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #080809;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --glass-hover: rgba(255,255,255,0.07);
      --accent: #9394a5;
      --accent2: #c4c5d6;
      --accent-glow: rgba(147,148,165,0.25);
      --text: #e8e8f0;
      --text2: #7a7a8a;
      --user-bg: linear-gradient(135deg, #6b6c7e, #9394a5);
      --ai-bg: rgba(255,255,255,0.04);
      --ai-border: rgba(255,255,255,0.08);
      --input-bg: rgba(255,255,255,0.05);
    }
    :root[data-theme="light"] {
      --bg: #f0f0f2;
      --glass: rgba(255,255,255,0.7);
      --glass-border: rgba(147,148,165,0.2);
      --glass-hover: rgba(255,255,255,0.9);
      --accent: #6b6c7e;
      --accent2: #4a4b5e;
      --accent-glow: rgba(107,108,126,0.2);
      --text: #1a1a22;
      --text2: #6a6a7a;
      --user-bg: linear-gradient(135deg, #6b6c7e, #9394a5);
      --ai-bg: rgba(255,255,255,0.8);
      --ai-border: rgba(147,148,165,0.15);
      --input-bg: rgba(255,255,255,0.8);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background 0.3s;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 70% 30%, var(--accent-glow) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .sidebar {
      width: 260px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .sidebar-logo {
      padding: 20px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-logo-icon { font-size: 24px; }

    .sidebar-logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-section {
      padding: 16px 12px;
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-label {
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed var(--glass-border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      border-color: var(--accent);
      color: var(--accent2);
      background: var(--glass-hover);
    }

    .chat-history-item {
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 2px;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-history-item:hover { background: var(--glass-hover); color: var(--text); }
    .chat-history-item.active { background: rgba(147,148,165,0.15); color: var(--accent2); }

    .sidebar-bottom {
      padding: 16px 20px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .moon-ascii {
      font-family: monospace;
      font-size: 9px;
      color: var(--accent);
      line-height: 1.3;
      text-align: center;
      animation: moonGlow 3s ease-in-out infinite;
      white-space: pre;
    }

    @keyframes moonGlow {
      0%, 100% { opacity: 0.5; text-shadow: 0 0 4px var(--accent); }
      50% { opacity: 1; text-shadow: 0 0 12px var(--accent2), 0 0 20px var(--accent); }
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    .status-text { font-size: 11px; color: #22c55e; font-weight: 500; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s;
      color: var(--text);
    }

    .icon-btn:hover { background: var(--glass-hover); border-color: var(--accent); }

    .modes-bar {
      display: flex;
      gap: 6px;
      padding: 10px 20px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .modes-bar::-webkit-scrollbar { display: none; }

    .mode-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .mode-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .mode-btn.active { background: rgba(147,148,165,0.15); border-color: var(--accent); color: var(--accent2); }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #chat-box::-webkit-scrollbar { width: 3px; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    .message {
      display: flex;
      gap: 10px;
      max-width: 78%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant, .message.thinking { align-self: flex-start; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      align-self: flex-end;
    }

    .msg-avatar.ai-av {
      background: linear-gradient(135deg, #6b6c7e, #9394a5);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .msg-avatar.user-av {
      background: var(--glass);
      border: 1px solid var(--glass-border);
    }

    .msg-content { display: flex; flex-direction: column; gap: 4px; flex: 1; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.assistant .msg-bubble, .message.thinking .msg-bubble {
      background: var(--ai-bg);
      border: 1px solid var(--ai-border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
      color: var(--text);
    }

    .message.thinking .msg-bubble { opacity: 0.6; font-style: italic; font-size: 13px; }

    .message.user .msg-bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: white;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .input-area {
      padding: 14px 20px 18px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .input-row { display: flex; gap: 8px; align-items: center; }

    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 10px 16px;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(10px);
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    #user-input::placeholder { color: var(--text2); }

    #mic-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 2px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    #mic-btn:hover { opacity: 1; background: none; }
    #mic-btn.listening { opacity: 1; animation: pulse 1s infinite; }

    #send-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--user-bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.1s;
      flex-shrink: 0;
      font-size: 18px;
      padding: 0;
      color: white;
    }

    #send-btn:hover { transform: scale(1.05); }
    #send-btn:disabled { opacity: 0.5; transform: none; }

    .input-hint { font-size: 11px; color: var(--text2); text-align: center; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
        z-index: 100;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .hamburger { display: flex; }
      .message { max-width: 90%; font-size: 13px; }
      .mode-btn { font-size: 11px; padding: 5px 10px; }
      #send-btn { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="sidebar-logo-icon">🌙</span>
      <span class="sidebar-logo-text">Moonbyte</span>
    </div>
    <div class="sidebar-section">
      <button class="new-chat-btn" onclick="clearMemory()">✚ New Chat</button>
      <div class="sidebar-label">Recent</div>
      <div id="chat-history"></div>
    </div>
    <div class="sidebar-bottom">
      <pre class="moon-ascii">    .  .  .
  .  ██████  .
 . ████████  .
 . ████████  .
  .  ██████  .
    .  .  .
   ~ moonbyte ~</pre>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="header-left">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="status">
          <div class="status-dot"></div>
          <span class="status-text">Online</span>
        </div>
        <span class="header-title" id="mode-title">💬 General</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">☀️</button>
        <button class="icon-btn" onclick="clearMemory()">🗑️</button>
      </div>
    </div>

    <div class="modes-bar">
      <button class="mode-btn active" onclick="switchMode('general', this)">💬 General</button>
      <button class="mode-btn" onclick="switchMode('study', this)">📚 Study</button>
      <button class="mode-btn" onclick="switchMode('code', this)">💻 Code</button>
      <button class="mode-btn" onclick="switchMode('style', this)">👔 Style</button>
      <button class="mode-btn" onclick="switchMode('recipe', this)">🍳 Recipe</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
      <div class="input-row">
        <div class="input-wrap">
          <input id="user-input" type="text" placeholder="Ask Moonbyte anything..." />
          <button id="mic-btn" onclick="startVoice()">🎤</button>
        </div>
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
      <div class="input-hint">Press Enter to send · Switch modes above</div>
    </div>
  </div>

  <script>
    const conversationHistory = JSON.parse(localStorage.getItem('moonbyte-history')) || [];
    let chatSessions = JSON.parse(localStorage.getItem('moonbyte-sessions')) || [];

    const modes = {
      general: `You are Moonbyte, Irfan's personal AI. Talk to him like a close friend — casual, warm, real. Never sound robotic or formal.

Here's everything about Irfan:
- 2nd year CSE student at ACE Engineering College, Hyderabad
- Calm and chill personality
- Interests: web development, fashion, cooking, AI, Marvel (favourite: Moon Knight)
- Projects: Gentleman's Wardrobe (fashion website), My Kitchen Diaries (recipe app), Moonbyte (this AI)
- Favourite food: biryani and pizza
- Username: moonbyte
- Goals: campus placements in 3rd year, become a web developer
- Learning: HTML, CSS, JavaScript, Node.js, DSA

How to talk to him:
- Keep it short and casual like texting a friend
- No bullet points unless necessary
- No formal language
- Use his name sometimes but not every message
- Be real, be human, be warm`,

      study: `You are Moonbyte in Study Mode helping Irfan. He's a CSE student studying DBMS, OS, DSA, Java, web development. Explain simply like a friend who's good at studies. Keep it easy to understand, give examples, motivate him when needed. No robotic explanations.`,
      code: `You are Moonbyte in Code Mode. Help Irfan with code like a senior developer friend. He knows HTML, CSS, JavaScript and is learning more. Be direct, explain clearly, fix his bugs, suggest improvements. Talk casually.`,
      style: `You are Moonbyte in Style Mode. You are Irfan's personal fashion advisor and friend. He's into men's fashion and style. Give practical outfit advice for a college student in Hyderabad. Be real and casual about it.`,
      recipe: `You are Moonbyte in Recipe Mode. Help Irfan with cooking like a foodie friend. He loves biryani and pizza. Suggest simple practical recipes. Keep it fun and casual.`
    };

    let currentMode = "general";
    let systemPrompt = modes.general;

    function renderChatHistory() {
      const container = document.getElementById('chat-history');
      container.innerHTML = '';
      chatSessions.slice(-8).reverse().forEach((session, i) => {
        const div = document.createElement('div');
        div.className = 'chat-history-item' + (i === 0 ? ' active' : '');
        div.textContent = session.title || 'Conversation';
        container.appendChild(div);
      });
    }

    window.onload = () => {
      const saved = localStorage.getItem('moonbyte-history');
      if (saved) {
        const parsed = JSON.parse(saved);
        parsed.forEach(msg => {
          conversationHistory.push(msg);
          addMessage(msg.role === "user" ? "user" : "assistant", msg.content);
        });
        addMessage("assistant", "Welcome back Irfan! 🌙 I remember our last conversation.");
      } else {
        addMessage("assistant", "Hey Irfan! 🌙 Moonbyte is online. What can I help you with today?");
      }
      renderChatHistory();
    };

    function switchMode(mode, btn) {
      currentMode = mode;
      systemPrompt = modes[mode];
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('mode-title').textContent = btn.textContent.trim();
      document.getElementById('chat-box').innerHTML = '';
      const welcomes = {
        general: "Hey Irfan! 🌙 Switched to General mode. What's on your mind?",
        study: "📚 Study Mode ON! What subject are we tackling today Irfan?",
        code: "💻 Code Mode ON! Share your code or tell me what you're building Irfan!",
        style: "👔 Style Mode ON! Let's talk fashion Irfan. What's the occasion?",
        recipe: "🍳 Recipe Mode ON! Hungry Irfan? Tell me what ingredients you have!"
      };
      addMessage("assistant", welcomes[mode]);
      conversationHistory.length = 0;
    }

    function clearMemory() {
      if (conversationHistory.length > 0) {
        const firstMsg = conversationHistory.find(m => m.role === 'user');
        const title = firstMsg ? firstMsg.content.slice(0, 30) + '...' : 'Conversation';
        chatSessions.push({ title, time: Date.now() });
        localStorage.setItem('moonbyte-sessions', JSON.stringify(chatSessions));
        renderChatHistory();
      }
      localStorage.removeItem('moonbyte-history');
      conversationHistory.length = 0;
      document.getElementById('chat-box').innerHTML = '';
      addMessage("assistant", "Memory cleared! Fresh start Irfan. 🌙");
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const btn = document.getElementById("send-btn");
      const userText = input.value.trim();
      if (!userText) return;

      addMessage("user", userText);
      input.value = "";
      btn.disabled = true;

      const mathRegex = /^[\d\s\+\-\*\/\(\)\.]+$/;
      let processedText = userText;
      if (mathRegex.test(userText)) {
        const result = calculate(userText);
        processedText = `${userText} = ${result}`;
      }

      conversationHistory.push({ role: "user", content: processedText });
      const thinkingDiv = addMessage("thinking", "Moonbyte is thinking...");

      try {
        let reply = null;
        try {
          const groqResponse = await fetch("/.netlify/functions/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: conversationHistory,
              systemPrompt: systemPrompt + `\n\nCURRENT TIME RIGHT NOW: ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}. When user asks for time or date, directly tell them this exact time.`
            })
          });
          const groqData = await groqResponse.json();
          if (groqData.reply) reply = groqData.reply;
        } catch (e) { console.log("Groq failed 🔄"); }

        conversationHistory.push({ role: "assistant", content: reply || "Something went wrong." });
        localStorage.setItem('moonbyte-history', JSON.stringify(conversationHistory));

        thinkingDiv.className = "message assistant";
        thinkingDiv.innerHTML = `<div class="msg-avatar ai-av">🌙</div><div class="msg-content"><div class="msg-bubble">${formatReply(reply || "Something went wrong. Try again!")}</div></div>`;

      } catch (error) {
        thinkingDiv.className = "message assistant";
        thinkingDiv.innerHTML = `<div class="msg-avatar ai-av">🌙</div><div class="msg-content"><div class="msg-bubble">Something went wrong. Try again!</div></div>`;
      }

      btn.disabled = false;
      input.focus();
    }

    function formatReply(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    function addMessage(role, text) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `message ${role}`;
      if (role === "user") {
        div.innerHTML = `<div class="msg-avatar user-av">👤</div><div class="msg-content"><div class="msg-bubble">${formatReply(text)}</div></div>`;
      } else {
        div.innerHTML = `<div class="msg-avatar ai-av">🌙</div><div class="msg-content"><div class="msg-bubble">${formatReply(text)}</div></div>`;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    document.getElementById("user-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function startVoice() {
      const btn = document.getElementById("mic-btn");
      const input = document.getElementById("user-input");
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = "en-IN";
      recognition.interimResults = false;
      btn.classList.add("listening");
      btn.textContent = "🔴";
      recognition.start();
      recognition.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        btn.classList.remove("listening");
        btn.textContent = "🎤";
        sendMessage();
      };
      recognition.onerror = recognition.onend = () => {
        btn.classList.remove("listening");
        btn.textContent = "🎤";
      };
    }

    function calculate(expression) {
      try { return eval(expression); }
      catch { return "Invalid calculation"; }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('theme-btn');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '🌙';
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = '☀️';
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }
  </script>
</body>
</html>
